name: Google Play (internal)

# Builds the release app bundle on every push to main and uploads it to the
# Play Console internal testing track.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'ios/**'
      - 'store/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: play-internal
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.4
  PACKAGE_NAME: ps.rocab.support
  # Play versionCode = base + GitHub run number. If Play rejects a code as
  # already used, raise the base above the highest code in the Play Console.
  VERSION_CODE_BASE: 100

jobs:
  play-internal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The upload key is gitignored; secrets hold keystore/keystore.jks
      # (base64) and keystore/pass.txt (as-is).
      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS_TXT: ${{ secrets.KEYSTORE_PASS_TXT }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASS_TXT" ]; then echo "::error::KEYSTORE_BASE64 / KEYSTORE_PASS_TXT secrets are not set"; exit 1; fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/keystore.jks
          printf '%s\n' "$KEYSTORE_PASS_TXT" > keystore/pass.txt

      - name: Build app bundle
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          DEFINES=""
          [ -n "$API_BASE_URL" ] && DEFINES="--dart-define=API_BASE_URL=$API_BASE_URL"
          flutter build appbundle --release --build-number=$((VERSION_CODE_BASE + GITHUB_RUN_NUMBER)) $DEFINES

      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
